name: daily-market-data
on:
  schedule:
    # UTC 週日至週四 21:15 與 22:15（＝台北週一至週五 05:15／06:15）。
    # 腳本只在芝加哥 16:00–17:00（CME 休市時段）之後正式執行，冬令／夏令自動對應。
    - cron: "15 21 * * 0-4"
    - cron: "15 22 * * 0-4"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(TZ=Asia/Taipei date +%F)"
          git push
