name: daily-market-data
on:
  schedule:
    # UTC 週日至週四 21:15 與 22:15（＝台北週一至週五 05:15／06:15）。
    # 腳本只在芝加哥 16:00–17:00（CME 休市時段）之後正式執行，冬令／夏令自動對應。
    - cron: "15 21 * * 0-4"
    - cron: "15 22 * * 0-4"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(TZ=Asia/Taipei date +%F)"
          # GitHub 偶發 500／連線錯誤（11/13 06:17 push 被拒，當日資料沒存上），重試 5 次、間隔遞增
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then echo "push ok (try $i)"; exit 0; fi
            echo "push failed (try $i), retry in $((i*20))s"; sleep $((i*20))
          done
          echo "::error::push failed after 5 tries"; exit 1
